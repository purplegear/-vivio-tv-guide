name: Check free RSS TV programme feeds
on:
  push:
    paths:
      - '.github/workflows/probe-tv-feeds.yml'
      - 'scripts/probe-tv-feeds.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test RSS/XMLTV downloads and field coverage
        run: node scripts/probe-tv-feeds.mjs
