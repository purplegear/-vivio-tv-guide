name: Update & publish VIVIO TV Guide

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 1,7,13,19 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: vivio-tv-guide-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify application (no mock programme listings)
        run: npm test
      - name: Get fresh real guide listings
        run: node scripts/build-data.js
      - name: Save updates back to repository for the next build
        run: |
          git config user.name 'VIVIO EPG Updater'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/data
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh real TV guide data [skip ci]'
            if ! git push origin HEAD:main; then
              echo "::warning::Could not persist refreshed data to GitHub; continuing to publish this fresh build."
            fi
          else
            echo 'No EPG changes to commit'
          fi
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Publish this updated version to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
